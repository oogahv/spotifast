name: Custom Windows build

# Builds spotifast.exe for Windows (x64) with this fork's changes, on each
# push to its branch or when started by hand from the Actions tab. The .exe
# is attached to the run as "spotifast-windows-x64".

on:
  push:
    branches: ["visualise-and-snap"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    env:
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      # The repository pins its toolchain; make sure the pinned one has the target.
      - run: rustup target add x86_64-pc-windows-msvc
      # libprojectM (MilkDrop) reads OpenGL through GLEW on Windows.
      - name: GLEW for libprojectM
        run: vcpkg install glew:x64-windows-static
      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - run: cargo build --release --target x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@v4
        with:
          name: spotifast-windows-x64
          path: target/x86_64-pc-windows-msvc/release/spotifast.exe
          if-no-files-found: error
